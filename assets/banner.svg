<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08080F"/>
      <stop offset="100%" style="stop-color:#0F0F1B"/>
    </linearGradient>

    <!-- Accent gradient for text -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#A5B4FC"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Orb glow -->
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#818CF8;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#818CF8;stop-opacity:0"/>
    </radialGradient>

    <clipPath id="clip">
      <rect width="900" height="200" rx="12"/>
    </clipPath>
  </defs>

  <!-- Outer rounded rect -->
  <rect width="900" height="200" rx="12" fill="url(#bg)"/>

  <!-- Clipped content -->
  <g clip-path="url(#clip)">
    <!-- Dot grid pattern -->
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(255,255,255,0.055)"/>
    </pattern>
    <rect width="900" height="200" fill="url(#dots)"/>

    <!-- Orbs -->
    <ellipse cx="120" cy="100" rx="200" ry="160" fill="url(#orb1)"/>
    <ellipse cx="820" cy="60" rx="150" ry="120" fill="url(#orb2)"/>

    <!-- Top accent line -->
    <rect x="0" y="0" width="900" height="2" fill="url(#accent)" opacity="0.6"/>

    <!-- Left: avatar placeholder circle with indigo ring -->
    <circle cx="110" cy="100" r="58" fill="#0F0F1B" stroke="#6366F1" stroke-width="1.5" opacity="0.8"/>
    <circle cx="110" cy="100" r="54" fill="#161625"/>
    <!-- Silhouette icon inside circle -->
    <text x="110" y="118" text-anchor="middle" font-size="52">🧑🏾‍💻</text>

    <!-- Right: text block -->
    <!-- Available pill -->
    <rect x="192" y="28" width="130" height="20" rx="10" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
    <circle cx="204" cy="38" r="3.5" fill="#34D399">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="212" y="43" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="9.5" fill="#34D399" letter-spacing="0.08em">AVAILABLE FOR ROLES</text>

    <!-- Name -->
    <text x="192" y="88" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#accent)" filter="url(#glow)" letter-spacing="-0.5">Iyanuoluwa Oke</text>

    <!-- Title -->
    <text x="194" y="118" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400" fill="#94A3B8" letter-spacing="0.01em">Independent Robotics &amp; AI Systems Engineer</text>

    <!-- Divider line -->
    <rect x="192" y="130" width="280" height="1" fill="rgba(255,255,255,0.08)"/>

    <!-- Tags row -->
    <text x="192" y="152" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6366F1" letter-spacing="0.04em">Autonomous Systems</text>
    <text x="332" y="152" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#475569">·</text>
    <text x="342" y="152" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6366F1" letter-spacing="0.04em">Computer Vision</text>
    <text x="458" y="152" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#475569">·</text>
    <text x="468" y="152" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#6366F1" letter-spacing="0.04em">Multi-Agent AI</text>

    <!-- Location -->
    <text x="192" y="174" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569">📍 Manchester, United Kingdom</text>
    <text x="342" y="174" font-family="'Segoe UI', system-ui, sans-serif" font-size="11.5" fill="#475569">  ·  iyanuoluwaoke.vercel.app</text>

    <!-- Right side — stat boxes -->
    <rect x="680" y="38" width="90" height="56" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
    <text x="725" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#A5B4FC">15+</text>
    <text x="725" y="78" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B" letter-spacing="0.05em">PROJECTS</text>

    <rect x="788" y="38" width="90" height="56" rx="10" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
    <text x="833" y="62" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#A5B4FC">5+</text>
    <text x="833" y="78" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B" letter-spacing="0.05em">YEARS</text>

    <rect x="680" y="108" width="198" height="56" rx="10" fill="rgba(99,102,241,0.05)" stroke="rgba(99,102,241,0.15)" stroke-width="1"/>
    <text x="779" y="132" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#A5B4FC">10+</text>
    <text x="779" y="150" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#64748B" letter-spacing="0.05em">LIVE DEPLOYMENTS</text>
  </g>

  <!-- Border -->
  <rect width="900" height="200" rx="12" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
</svg>
