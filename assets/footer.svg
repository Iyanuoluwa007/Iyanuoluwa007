      <stop stop-color="#050816"/>
      <stop offset="1" stop-color="#0A1023"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="140" rx="22" fill="url(#fbg)"/>

  <!-- Centered title -->
