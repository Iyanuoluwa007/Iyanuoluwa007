<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arcade Pulse Animation">
  <rect width="900" height="220" rx="18" fill="#020817"/>
  <rect x="20" y="20" width="860" height="180" rx="14" fill="#081120" stroke="#1f2937"/>

  <text x="38" y="52" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">
