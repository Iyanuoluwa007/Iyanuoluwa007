  <!-- right-side status panel -->
  <g transform="translate(360 92)">
    <rect x="0" y="0" width="490" height="100" rx="12" fill="#0b1220" stroke="#1e293b"/>
    <text x="20" y="28" fill="#22c55e" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
      ACTIVE SYSTEMS
    </text>
    <text x="20" y="52" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">
      Robotics
    </text>
    <text x="140" y="52" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">
      Computer Vision
    </text>
    <text x="315" y="52" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="13">
      AI Systems
    </text>

    <circle cx="90" cy="48" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.35;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="48" r="5" fill="#4ade80">
